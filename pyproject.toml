# Before building, use scripts/install_python_deps.sh so mpi4py and h5py match
# the selected MPI and cfd_externals HDF5.
#
# wheel/full install:
# CC=mpicc CXX=mpicxx CMAKE_BUILD_PARALLEL_LEVEL=32 pip install . --no-build-isolation --verbose
#
# editable (use the same compiler as the main C++ build):
# CC=mpicc CXX=mpicxx CMAKE_BUILD_PARALLEL_LEVEL=32 pip install -e . --no-build-isolation
#
# If pip-built .so files fail with GLIBCXX version errors (e.g. anaconda Python
# loads an older libstdc++), use the same GCC version as your Python environment:
# CC=/usr/bin/gcc-11 CXX=/usr/bin/g++-11 CMAKE_BUILD_PARALLEL_LEVEL=32 pip install -e . --no-build-isolation
#
# In-place (no pip install needed):
# cmake --build build -t dnds_pybind11 geom_pybind11 cfv_pybind11 eulerP_pybind11 -j32
# cmake --install build --component py
# PYTHONPATH=python pytest test/        # or: export PYTHONPATH=$PWD/python


[build-system]
requires = [
    "scikit-build-core>=0.11",
    "pybind11>=2.11,<4",
    "pybind11-stubgen>=2.5",
    "typing_extensions>=4.8",
    "numpy>=1.25,<3",
]
build-backend = "scikit_build_core.build"

[project]
name = "DNDSR"
description = "MPI-parallel Compact Finite Volume research solvers with optional CUDA and Cantera support"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
license-files = [
    "LICENSE",
    "THIRD_PARTY_DEPENDENCIES.md",
    "licenses/*.txt",
]
dynamic = ["version"]
dependencies = [
    "numpy>=1.25,<3",
    "mpi4py>=4,<5",
]
keywords = [
    "computational-fluid-dynamics",
    "finite-volume",
    "mpi",
    "reactive-flow",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.urls]
Repository = "https://github.com/Kirabo167/DNDSR"
Documentation = "https://cfdlab-thu.github.io/DNDSR/"
ForkDocumentation = "https://github.com/Kirabo167/DNDSR/tree/main/docs"
Issues = "https://github.com/Kirabo167/DNDSR/issues"

[project.optional-dependencies]
test = [
    "h5py>=3.16,<4",
    "pytest>=7.4",
    "pytest-timeout>=2.2",
]
chemistry = [
    "cantera>=3.2,<3.3",
]
postprocess = [
    "h5py>=3.16,<4",
    "scipy>=1.11,<2",
    "sympy>=1.12,<2",
    "pandas>=2,<3",
    "matplotlib>=3.7,<4",
    "dash>=2.14,<4",
    "plotly>=5.18,<7",
    "Pillow>=9.5",
    "python-pptx>=0.6.21",
    "imageio-ffmpeg>=0.4.9",
    "pyvista>=0.43,<1",
    "numba>=0.58,<1",
]
docs = [
    "matplotlib>=3.7,<4",
    "sphinx>=7.2,<9",
    "breathe>=4.35",
    "myst-parser>=3.0",
    "sphinxawesome-theme>=6.0",
    "sphinx-copybutton>=0.5",
]
# Contributor essentials. mpi4py and h5py should still be installed through
# scripts/install_python_deps.sh so they use the project's MPI and HDF5.
# clang-format is provided by the system package manager.
dev = [
    "h5py>=3.16,<4",
    "pytest>=7.4",
    "pytest-timeout>=2.2",
    "jsonschema>=4.17,<5",
    "PyYAML>=6,<7",
    "autopep8>=2",
    "nbstripout>=0.6",
]


[tool.scikit-build]
experimental = true
minimum-version = "build-system.requires"
metadata.version.provider = "version_provider"
metadata.version.provider-path = "cmake"

cmake.version = ">=3.21"
cmake.build-type = "Release"
build.targets = [
    "dnds_pybind11",
    "geom_pybind11",
    "cfv_pybind11",
    "eulerP_pybind11",
]
build.verbose = true
build-dir = "build_py/{wheel_tag}"
cmake.args = ["-G", "Ninja"]
install.components = ["py"]
wheel.exclude = ["**/.gitignore"]
# The Git submodule source is large and still insufficient for an isolated
# source build because header-only dependencies are distributed separately.
sdist.exclude = ["external/cfd_externals"]

# The Python package exposes the non-reactive EulerP bindings. Avoid requiring
# the optional C++ Cantera dependency for a normal wheel/editable build.
[tool.scikit-build.cmake.define]
DNDS_USE_CANTERA = "OFF"
DNDS_BUILD_TESTS = "OFF"

[tool.scikit-build.wheel.packages]
"DNDSR" = "python/DNDSR"

[tool.pytest.ini_options]
testpaths = ["test"]
markers = [
    "mpi: tests requiring mpirun",
    "cuda: tests requiring CUDA device",
    "slow: long-running tests",
]
timeout = 120
